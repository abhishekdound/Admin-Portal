<div class="mt-2 user-main">
  <div class="user-main-dashboard-heaer">
    <app-dashboard-header [this]="'User'"></app-dashboard-header>
  </div>
  <!-- Search Bar And Add User-->
  <div class="actions">
    <div class="searchBar">
      <input type="text" placeholder="Search..." (input)="checkSearchBar($event)" />
    </div>
    <!-- excel download button -->
    <div>
      <i class="fa-solid fa-file-csv" (click)="downloadInExcel()"></i>
    </div>

    <div class="addButton">
      <button class="btn btn-primary" (click)="openModal(template)">+ Add User</button>
      <ng-template #template>
  <form #userForm="ngForm" (ngSubmit)="saveUser(userForm)">
    <div class="modal-header">
      <h4 class="modal-title">{{ modalType }} User</h4>
      <button class="btn-close" (click)="modalRef?.hide()"></button>
    </div>

    <div class="modal-body">

      <!-- Name -->
      <label class="form-label">Name</label>
      <input
        class="form-control mb-1"
        name="name"
        required
        [(ngModel)]="selectedUser.name"
        #name="ngModel"
      />
      <small class="text-danger" *ngIf="name.invalid && name.touched">
        Name is required
      </small>

      <!-- Age -->
      <label class="form-label mt-2">Age</label>
      <input
        type="number"
        class="form-control mb-1"
        name="age"
        required
        min="1"
        [(ngModel)]="selectedUser.age"
        #age="ngModel"
      />
      <small class="text-danger" *ngIf="age.invalid && age.touched">
        Valid age required
      </small>

      <!-- DOB -->
      <label class="form-label mt-2">Date of Birth</label>
      <input
        type="date"
        class="form-control mb-1"
        name="dob"
        required
        [(ngModel)]="selectedUser.dob"
        #dob="ngModel"
      />
      <small class="text-danger" *ngIf="dob.invalid && dob.touched">
        DOB required
      </small>

      <!-- Email -->
      <label class="form-label mt-2">Email</label>
      <input
        type="email"
        class="form-control mb-1"
        name="mail"
        placeholder="xyz@application.com"
        required
        email
        [(ngModel)]="selectedUser.mail"
        #mail="ngModel"
      />
      <small class="text-danger" *ngIf="mail.invalid && mail.touched">
        Valid email required
      </small>

      <!-- Image -->
      <label class="form-label mt-2">Profile Image</label>
      <input
        type="file"
        class="form-control mb-1"
        (change)="onImageSelect($event)"
      />
      <small class="text-danger">{{ imageError }}</small>

      <img
        *ngIf="imagePreview"
        [src]="imagePreview"
        width="80"
        height="80"
        class="rounded-circle mt-2"
        style="object-fit: cover"
      />
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="modalRef?.hide()">
        Cancel
      </button>
      <button class="btn btn-primary" type="submit" [disabled]="userForm.invalid">
        Save
      </button>
    </div>
  </form>
</ng-template>



    </div>
  </div>

  <div class="ngx-datatable-table">
    <ngx-datatable
      #table
      class="material striped"
      [rows]="temp()"
      [columnMode]="'standard'"
      [headerHeight]="50"
      [footerHeight]="50"
      [rowHeight]="'auto'"
      [limit]="10"
      [sortType]="sortType"
      [loadingIndicator]="loading()"
      [offset]="0"
      [scrollbarH]="true"
    >
      <!-- Image -->
      <ngx-datatable-column name="Avatar" [sortable]="false">
        <ng-template ngx-datatable-cell-template let-row="row">
          <img
            [src]="row.image"
            width="60"
            height="60"
            style="border-radius: 50%; object-fit: cover"
          />
        </ng-template>
      </ngx-datatable-column>

      <!-- Name -->
      <ngx-datatable-column
        name="Name"
        prop="name"
        [sortable]="true"
        [width]="200"
      ></ngx-datatable-column>

      <!-- Age -->
      <ngx-datatable-column
        name="Age"
        prop="age"
        [sortable]="true"
        [width]="200"
      ></ngx-datatable-column>

      <!-- Gender And DOB -->
      <ngx-datatable-column name="Gender-DOB" [sortable]="false" [width]="200">
        <ng-template ngx-datatable-cell-template let-row="row">
          {{ row.gender }},
          {{ row.dob | date : 'MMM d, y' }}
        </ng-template>
      </ngx-datatable-column>

      <!-- Email -->
      <ngx-datatable-column prop="mail" [sortable]="true" [width]="300">
        <ng-template ngx-datatable-cell-template let-row="row">
          {{ row.mail }}
        </ng-template>
      </ngx-datatable-column>

      <!-- Action -->
      <ngx-datatable-column name="Action" [width]="200" [sortable]="false">
        <ng-template ngx-datatable-cell-template let-row="row">
          <div>
            <!-- edit row -->
            <i
              class="fa-solid fa-pen-to-square me-3 text-secondary"
              (click)="openModal(template, row)"
            ></i>
            <!-- delete row -->
            <i class="fa-solid fa-trash text-danger" (click)="deleteRow(row)"></i>
          </div>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>
