<div class="mt-2 user-main">
  <div class="user-main-dashboard-heaer">
    <app-dashboard-header [this]="'User'"></app-dashboard-header>
  </div>
  <!-- Search BAr -->
  <div class="searchBar">
    <div class="actions d-flex allign-item-center justify-content-end">
    <input type="text" placeholder="Search..." 
    (input)="checkSearchBar($event)"/>
  </div>
  </div>

  <div class="ngx-datatable-table container ">
    <ngx-datatable
      #table
      class="material striped"
      [rows]="temp()"
      [columnMode]="'force'"
      [headerHeight]="50"
      [footerHeight]="50"
      [rowHeight]="'auto'"
      [limit]="10"
      [sortType]="sortType"
      [loadingIndicator]="loading()"
      [offset]="0"
    >
      <!-- Image -->
      <ngx-datatable-column name="Avatar" [sortable]="false">
        <ng-template ngx-datatable-cell-template let-row="row">
          <img
            [src]="row.image"
            width="60"
            height="60"
            style="border-radius: 50%; object-fit: cover"
          />
        </ng-template>
      </ngx-datatable-column>

      <!-- Name -->
      <ngx-datatable-column name="Name" prop="name" [sortable]="true"></ngx-datatable-column>

      <!-- Age -->
      <ngx-datatable-column name="Age" prop="age" [sortable]="true"></ngx-datatable-column>

      <!-- Gender And DOB -->
      <ngx-datatable-column name="Gender-DOB"  [sortable]="false">
         <ng-template ngx-datatable-cell-template let-row="row">
          {{row.gender}},
          {{row.dob | date:'MMM d, y'}}
        </ng-template>
      </ngx-datatable-column>

      <!-- Email -->
      <ngx-datatable-column  prop="mail" [sortable]="true">
        <ng-template ngx-datatable-cell-template let-row="row">
          {{row.mail}}
        </ng-template>
      </ngx-datatable-column>

      
      
    </ngx-datatable>
  </div>
</div>
