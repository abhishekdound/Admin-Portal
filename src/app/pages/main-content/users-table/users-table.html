<div class="mt-0">
  <!-- Search Bar And Add User-->

  @if(mode()==='page'){
  <div class="actions premium-actions">
  <!-- Search -->
  <div class="searchBar position-relative">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input
      type="text"
      placeholder="Search users..."
      (input)="checkSearchBar($event)"
      class="search-input"
    />
  </div>

  <!-- Excel -->
  <button
    type="button"
    class="icon-btn excel-btn"
    title="Export to Excel"
    (click)="downloadInExcel()">
    <i class="fa-solid fa-file-excel"></i>
  </button>

  <!-- Add User -->
  <button
    class="btn btn-primary add-user-btn"
    (click)="openUserModal()">
    <i class="fa-solid fa-plus me-1"></i>
    Add User
  </button>
</div>

  }

  <div class="ngx-datatable-table">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">
      <!-- Avatar -->
      <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef>Avatar</th>
        <td mat-cell *matCellDef="let row">
          <img
            [src]="row.image || 'assets/default.png'"
            width="50"
            height="50"
            style="border-radius: 50%; object-fit: cover; display: block"
            (error)="row.image = 'assets/default.png'"
          />
        </td>
      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <!-- Age -->
      <ng-container matColumnDef="age">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Age</th>
        <td mat-cell *matCellDef="let row">{{ row.age }}</td>
      </ng-container>

      <!-- Gender + DOB -->
      <ng-container matColumnDef="genderDob">
        <th mat-header-cell *matHeaderCellDef>Gender / DOB</th>
        <td mat-cell *matCellDef="let row">{{ row.gender }}, {{ row.dob | date : 'MMM d, y' }}</td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="mail">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.mail }}</td>
      </ng-container>

      <!-- Action -->
      <ng-container
     matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let row"  class="action1" >
          @if (mode()==='card') {

            <i
        class="fa-solid fa-comment-dots me-3 text-primary"
        title="Chat"
        (click)="openChat(row)">
            </i>
          }
          @else {

            <i class="fa-solid fa-pen-to-square me-3" (click)="openUserModal(row)"></i>
            <i class="fa-solid fa-trash text-danger" (click)="deleteRow(row)"></i>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
  mat-row
  *matRowDef="let row; columns: displayedColumns"
  [class.active-row]="row.id === selectedUserId"
></tr>

    </table>

    <mat-paginator
      [pageSize]="mode() === 'card' ? 5 : 10"
      [pageSizeOptions]="mode() === 'page' ? [5, 10, 20] : []"
      showFirstLastButtons
    >
    </mat-paginator>
  </div>
</div>
